# Sandbox isolado CPU — não interfere em serviços existentes da VPS.
# Rede própria, porta 8095 apenas em 127.0.0.1 (exposta via túnel/reverse proxy se preciso),
# volumes dedicados em ./data, limites de CPU/memória.
name: cleaner-cpu

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: cleaner-worker-cpu:latest
    container_name: cleaner-cpu-worker
    restart: unless-stopped
    environment:
      CLEANER_WORKER_SECRET: ${CLEANER_WORKER_SECRET:?defina no .env}
      CLEANER_STORAGE: /app/storage
      CLEANER_DEVICE: cpu
      USE_CELERY: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    ports:
      - "127.0.0.1:8095:8000"
    volumes:
      - ./data/storage:/app/storage
      - ./data/models:/app/models
    tmpfs:
      - /tmp:size=1g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
          pids: 512
    security_opt:
      - no-new-privileges:true
    networks:
      - cleaner-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cleaner-net:
    name: cleaner-cpu-net
    driver: bridge
